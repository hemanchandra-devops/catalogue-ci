  security-events: read
  statuses: write
jobs:
  feature-pipeline:
    if: github.ref != 'refs/heads/main'
    uses: hemanchandra-devops/workflows/.github/workflows/featurenodejspipeline.yaml@main
    with:
      project: "roboshop"
      component: "catalogue"
      environment: "dev"
